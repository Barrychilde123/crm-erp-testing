{% extends "base.html" %}
{% block title %}新建采购订单 · 启明 CRM/ERP{% endblock %}
{% block breadcrumb %}ERP / 采购订单 / 新建{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">新建采购订单</h1>
    <div class="page-sub">选择供应商与产品，保存后可确认订单并收货入库</div>
  </div>
</div>
<div class="card">
  <form method="post">
    <div class="form-grid">
      <div class="form-group">
        <label>供应商<span class="req">*</span></label>
        <select class="form-control" name="supplier_id" required>
          <option value="">请选择供应商</option>
          {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <div class="card-head" style="margin-top:22px;"><div class="card-title">采购明细</div></div>
    <table class="line-table" id="line-table">
      <thead><tr><th style="width:40%;">产品</th><th style="width:15%;">数量</th><th style="width:18%;">单价</th><th style="width:15%;">小计</th><th style="width:12%;"></th></tr></thead>
      <tbody>
        <tr class="line-row">
          <td>
            <select class="form-control product-select" name="product_id" onchange="fillPrice(this)">
              <option value="">请选择产品</option>
              {% for p in products %}<option value="{{ p.id }}" data-price="{{ p.price }}">{{ p.name }}（{{ p.sku }}）</option>{% endfor %}
            </select>
          </td>
          <td><input class="form-control" name="qty" type="number" min="1" value="1" onchange="updateTotal()"></td>
          <td><input class="form-control" name="price" type="number" min="0" step="0.01" value="0" onchange="updateTotal()"></td>
          <td class="line-subtotal">0.00</td>
          <td><button class="btn btn-ghost btn-sm" type="button" onclick="removeLine(this)">删除</button></td>
        </tr>
      </tbody>
    </table>
    <div style="margin-top:10px;">
      <button class="btn btn-secondary btn-sm" type="button" onclick="addLine()">+ 添加明细</button>
    </div>
    <div class="order-total">合计：<strong id="order-total">0.00</strong> 元</div>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">保存采购订单</button>
      <a class="btn btn-secondary" href="{{ url_for('erp.purchase_orders') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
