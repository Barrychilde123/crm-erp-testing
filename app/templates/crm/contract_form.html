{% extends "base.html" %}
{% block title %}新建合同 · 启明 CRM/ERP{% endblock %}
{% block breadcrumb %}CRM / 合同管理 / 新建合同{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">新建合同</h1>
    <div class="page-sub">合同编号留空时系统自动生成</div>
  </div>
</div>
<div class="card form-card">
  <form method="post">
    <div class="form-grid">
      <div class="form-group">
        <label>合同编号</label>
        <input class="form-control" name="contract_no" placeholder="留空自动生成，如 HT20261028001">
      </div>
      <div class="form-group">
        <label>客户<span class="req">*</span></label>
        <select class="form-control" name="customer_id" required>
          <option value="">请选择客户</option>
          {% for c in customers %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>合同金额</label>
        <input class="form-control" name="amount" type="number" step="0.01" min="0" value="0">
      </div>
      <div class="form-group">
        <label>状态</label>
        <select class="form-control" name="status">
          <option value="draft">草稿</option>
          <option value="signed">已签署</option>
          <option value="closed">已关闭</option>
        </select>
      </div>
      <div class="form-group">
        <label>签署日期</label>
        <input class="form-control" name="sign_date" type="date" value="{{ today }}">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">保存</button>
      <a class="btn btn-secondary" href="{{ url_for('crm.contracts') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
