{% extends "base.html" %}
{% block title %}{{ '编辑商机' if opportunity else '新建商机' }} · 启明 CRM/ERP{% endblock %}
{% block breadcrumb %}CRM / 商机管道 / {{ '编辑商机' if opportunity else '新建商机' }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">{{ '编辑商机' if opportunity else '新建商机' }}</h1>
    <div class="page-sub">维护商机金额、阶段与预计成交时间</div>
  </div>
</div>
<div class="card form-card">
  <form method="post">
    <div class="form-grid">
      <div class="form-group">
        <label>商机名称<span class="req">*</span></label>
        <input class="form-control" name="name" value="{{ opportunity.name if opportunity else '' }}" placeholder="例如：启明科技 - 智能仓储一期" required>
      </div>
      <div class="form-group">
        <label>客户<span class="req">*</span></label>
        <select class="form-control" name="customer_id" required>
          <option value="">请选择客户</option>
          {% for c in customers %}
          <option value="{{ c.id }}" {{ 'selected' if opportunity and opportunity.customer_id == c.id }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>商机金额</label>
        <input class="form-control" name="amount" type="number" step="0.01" min="0" value="{{ opportunity.amount if opportunity else '0' }}">
      </div>
      <div class="form-group">
        <label>阶段</label>
        <select class="form-control" name="stage">
          {% for key, label in stages %}
          <option value="{{ key }}" {{ 'selected' if opportunity and opportunity.stage == key }}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>预计成交日期</label>
        <input class="form-control" name="expected_date" type="date" value="{{ opportunity.expected_date if opportunity and opportunity.expected_date else '' }}">
      </div>
      <div class="form-group">
        <label>负责人</label>
        <select class="form-control" name="owner_id">
          <option value="">未分配</option>
          {% for u in owners %}
          <option value="{{ u.id }}" {{ 'selected' if opportunity and opportunity.owner_id == u.id }}>{{ u.full_name }}（{{ u.role|role_text }}）</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">保存</button>
      <a class="btn btn-secondary" href="{{ url_for('crm.opportunities') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
